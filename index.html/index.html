<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>카메라 번역 (→ 일본어)</title>
<style>
  :root { --bg:#111; --card:#1e1e22; --fg:#f2f2f2; --sub:#9a9aa3; --accent:#4f8cff; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans JP", sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 12px 12px calc(24px + env(safe-area-inset-bottom)); }
  h1 { font-size: 18px; margin: 8px 0 12px; }
  .view { position: relative; background:#000; border-radius: 14px; overflow: hidden; aspect-ratio: 3/4; }
  video, canvas#shot { width:100%; height:100%; object-fit: cover; display:block; }
  canvas#shot { display:none; }
  .btns { display:flex; gap:8px; margin: 12px 0; }
  button, label.btn { flex:1; padding: 14px; border:0; border-radius: 12px; font-size: 16px; font-weight: 600;
    background: var(--accent); color:#fff; text-align:center; cursor:pointer; }
  button.sec, label.btn.sec { background: var(--card); color: var(--fg); }
  button:disabled { opacity:.5; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin-top: 10px; }
  .card h2 { font-size: 13px; color: var(--sub); margin: 0 0 6px; font-weight: 600; }
  .card p { margin: 0; white-space: pre-wrap; line-height: 1.6; word-break: break-word; }
  #jp { font-size: 20px; }
  #status { color: var(--sub); font-size: 14px; min-height: 20px; margin-top: 6px; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📷 카메라 번역 · 한국어/영어 → 日本語</h1>

  <div class="view">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="shot"></canvas>
  </div>

  <div class="btns">
    <button id="snap">촬영 & 번역</button>
    <button id="retake" class="sec" style="display:none">다시 찍기</button>
  </div>
  <div class="btns">
    <button id="flip" class="sec">전/후면 전환</button>
    <label class="btn sec" for="file">사진 선택</label>
    <input id="file" type="file" accept="image/*">
  </div>
  <div id="status"></div>

  <div class="card"><h2>인식된 글자</h2><p id="orig">-</p></div>
  <div class="card"><h2>일본어 번역</h2><p id="jp">-</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const video = $('video'), shot = $('shot'), statusEl = $('status');
let stream = null, facing = 'environment', worker = null;

async function startCamera() {
  stopCamera();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1440 } },
      audio: false
    });
    video.srcObject = stream;
    video.style.display = 'block'; shot.style.display = 'none';
    $('snap').style.display = ''; $('retake').style.display = 'none';
    statusEl.textContent = '';
  } catch (e) {
    statusEl.textContent = '카메라를 열 수 없어요. 권한을 허용하거나 "사진 선택"을 써보세요.';
  }
}
function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}

async function getWorker() {
  if (worker) return worker;
  statusEl.textContent = '글자 인식 엔진 불러오는 중… (처음 한 번만, 조금 걸려요)';
  worker = await Tesseract.createWorker('eng+kor');
  return worker;
}

function showFrozen() {
  video.style.display = 'none'; shot.style.display = 'block';
  $('snap').style.display = 'none'; $('retake').style.display = '';
}

async function processCanvas() {
  $('orig').textContent = '-'; $('jp').textContent = '-';
  try {
    const w = await getWorker();
    statusEl.textContent = '글자 인식 중…';
    const { data } = await w.recognize(shot);
    const text = cleanText(data.text);
    if (!text) { statusEl.textContent = '글자를 찾지 못했어요. 더 가깝고 밝게 찍어보세요.'; return; }
    $('orig').textContent = text;
    statusEl.textContent = '일본어로 번역 중…';
    const lang = /[\uAC00-\uD7A3]/.test(text) ? 'ko' : 'en';
    const jp = await translate(text, lang);
    $('jp').textContent = jp;
    statusEl.textContent = '완료 (' + (lang === 'ko' ? '한국어' : '영어') + ' → 일본어)';
  } catch (e) {
    console.error(e);
    statusEl.textContent = '오류: ' + (e.message || e);
  }
}

function cleanText(t) {
  return (t || '').replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
}

// MyMemory 무료 API (요청당 약 500자 제한) → 줄 단위로 묶어서 요청
async function translate(text, from) {
  const lines = text.split('\n').filter(l => l.trim());
  const chunks = []; let cur = '';
  for (const l of lines) {
    if ((cur + '\n' + l).length > 450) { if (cur) chunks.push(cur); cur = l.slice(0, 450); }
    else cur = cur ? cur + '\n' + l : l;
  }
  if (cur) chunks.push(cur);

  const out = [];
  for (const c of chunks) {
    const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(c) + '&langpair=' + from + '|ja';
    const r = await fetch(url);
    const j = await r.json();
    if (j.responseStatus && Number(j.responseStatus) !== 200) throw new Error(j.responseDetails || '번역 실패');
    out.push(j.responseData.translatedText);
  }
  return out.join('\n');
}

$('snap').onclick = async () => {
  if (!video.videoWidth) return;
  shot.width = video.videoWidth; shot.height = video.videoHeight;
  shot.getContext('2d').drawImage(video, 0, 0);
  showFrozen(); stopCamera();
  await processCanvas();
};
$('retake').onclick = startCamera;
$('flip').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; startCamera(); };

$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = async () => {
    const max = 2000, s = Math.min(1, max / Math.max(img.width, img.height));
    shot.width = img.width * s; shot.height = img.height * s;
    shot.getContext('2d').drawImage(img, 0, 0, shot.width, shot.height);
    URL.revokeObjectURL(img.src);
    showFrozen(); stopCamera();
    await processCanvas();
  };
  img.src = URL.createObjectURL(f);
  e.target.value = '';
};

startCamera();
</script>
</body>
</html>
